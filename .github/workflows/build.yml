name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets & Capacitor
        run: |
          mkdir -p www
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.png *.svg *.js *.css *.json www/ 2>/dev/null || true
          echo '{"appId": "com.pawankhadka.hisab","appName": "Hisab Calculator","webDir": "www","bundledWebRuntime": false}' > capacitor.config.json
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob
          npx cap add android

      - name: Inject AdMob App ID
        run: |
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4910288899576442~6619635154"/>' android/app/src/main/AndroidManifest.xml

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisab-calculator-admob
          path: android/app/build/outputs/apk/debug/app-debug.apk
