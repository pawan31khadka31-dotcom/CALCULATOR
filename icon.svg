<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle / Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Outer Ambient Gold Rim -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" />

  <!-- Calculator Main Body -->
  <g filter="url(#softShadow)">
    <rect x="80" y="64" width="352" height="384" rx="48" fill="#131c2e" stroke="#2a374e" stroke-width="3" />

    <!-- Calculator Display Screen -->
    <rect x="108" y="96" width="296" height="88" rx="24" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="2" />
    
    <!-- Screen Indicator dots & HISAB Brand -->
    <circle cx="128" cy="120" r="5" fill="#10b981" />
    <circle cx="144" cy="120" r="5" fill="#f59e0b" />
    <text x="382" y="124" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="end" letter-spacing="3">HISAB</text>
    
    <!-- Digital Screen Number Text -->
    <text x="382" y="166" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" text-anchor="end" letter-spacing="-1">1,250</text>

    <!-- Keypad Grid (3x3 clean icons) -->
    <!-- Row 1: C, %, ÷ -->
    <rect x="108" y="208" width="84" height="64" rx="18" fill="url(#btnGrad)" stroke="#3b4b66" stroke-width="1.5" />
    <text x="150" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">C</text>

    <rect x="214" y="208" width="84" height="64" rx="18" fill="url(#btnGrad)" stroke="#3b4b66" stroke-width="1.5" />
    <text x="256" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">%</text>

    <rect x="320" y="208" width="84" height="64" rx="18" fill="url(#goldGrad)" />
    <text x="362" y="252" fill="#0f172a" font-family="system-ui, sans-serif" font-size="32" font-weight="900" text-anchor="middle">÷</text>

    <!-- Row 2: 7, 8, × -->
    <rect x="108" y="288" width="84" height="64" rx="18" fill="url(#btnGrad)" stroke="#3b4b66" stroke-width="1.5" />
    <text x="150" y="332" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">7</text>

    <rect x="214" y="288" width="84" height="64" rx="18" fill="url(#btnGrad)" stroke="#3b4b66" stroke-width="1.5" />
    <text x="256" y="332" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">8</text>

    <rect x="320" y="288" width="84" height="64" rx="18" fill="url(#goldGrad)" />
    <text x="362" y="332" fill="#0f172a" font-family="system-ui, sans-serif" font-size="32" font-weight="900" text-anchor="middle">×</text>

    <!-- Row 3: ±, 0, = -->
    <rect x="108" y="368" width="84" height="64" rx="18" fill="url(#btnGrad)" stroke="#3b4b66" stroke-width="1.5" />
    <text x="150" y="412" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">±</text>

    <rect x="214" y="368" width="84" height="64" rx="18" fill="url(#btnGrad)" stroke="#3b4b66" stroke-width="1.5" />
    <text x="256" y="412" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">0</text>

    <!-- Equal Button Glowing Emerald Accent -->
    <rect x="320" y="368" width="84" height="64" rx="18" fill="#10b981" filter="url(#glow)" />
    <text x="362" y="412" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">=</text>
  </g>
</svg>
