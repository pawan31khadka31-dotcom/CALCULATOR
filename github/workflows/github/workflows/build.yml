name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets & Capacitor
        run: |
          mkdir -p www
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.png *.svg *.js *.css *.json www/ 2>/dev/null || true
          
          # Inject AdMob banner code into www/index.html
          cat << 'EOF' >> www/index.html
          <script>
          document.addEventListener("DOMContentLoaded", async function() {
            // Wait for Capacitor bridge to be fully ready
            setTimeout(async function() {
              try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
                  const AdMob = window.Capacitor.Plugins.AdMob;
                  await AdMob.initialize({ requestTrackingAuthorization: true });
                  await AdMob.showBanner({
                    adId: "ca-app-pub-4910288899576442/2691823429",
                    position: "BOTTOM_CENTER",
                    size: "BANNER",
                    margin: 0,
                    isTesting: false
                  });
                }
              } catch (e) {
                console.error("AdMob error: ", e);
              }
            }, 1000);
          });
          </script>
          EOF

          echo '{"appId": "com.pawankhadka.hisab","appName": "Hisab Calculator","webDir": "www","bundledWebRuntime": false}' > capacitor.config.json
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6
          npx cap add android

          # Restore custom calculator icon
          for d in android/app/src/main/res/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png 2>/dev/null || true
            cp icon-192.png $d/ic_launcher_round.png 2>/dev/null || true
            cp icon-512.png $d/ic_launcher_foreground.png 2>/dev/null || true
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml 2>/dev/null || true

      - name: Configure Android Manifest & AdMob Registration
        run: |
          # Inject Internet Permission & AdMob App ID into AndroidManifest.xml
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/!{/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4910288899576442~6619635154"/>' android/app/src/main/AndroidManifest.xml

          # Automatically register the Capacitor Community AdMob plugin in MainActivity.java
          MAIN_ACTIVITY="android/app/src/main/java/com/pawankhadka/hisab/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            sed -i 's/import com.getcapacitor.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport app.plugin.admob.AdMob;/' "$MAIN_ACTIVITY" || true
            sed -i '/public class MainActivity extends BridgeActivity {/a \    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(AdMob.class);\n    }' "$MAIN_ACTIVITY" || true
            # Ensure Bundle import exists
            sed -i 's/import android.os.Bundle;/import android.os.Bundle;/' "$MAIN_ACTIVITY" || true
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisab-calculator-admob
          path: android/app/build/outputs/apk/debug/app-debug.apk
